name: habit_tracker
description: "Track Free - Minimalist Bento habit tracker with privacy-first offline SQLite storage and cloud backup."
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  http: ^1.2.2
  path_provider: ^2.1.6
  widgets_kit: ^0.1.1
  flutter_timezone: ^5.1.1
  google_sign_in: ^7.2.0
  icloud_storage: ^2.2.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf

