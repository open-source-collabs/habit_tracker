# Analyzer and lint configuration. Run `flutter analyze`; it must report
# "No issues found!" (see AGENTS.md, Verification Protocol).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Async safety: a dropped Future hides errors and races.
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    # Consistency.
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - always_declare_return_types
    - avoid_dynamic_calls
    - unnecessary_lambdas
